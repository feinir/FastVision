<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 64 64" fill="none">
  <title>FastVision</title>
  <desc>A photo framed by the Fast series brackets over a segmented blue and violet app tile.</desc>
  <defs>
    <clipPath id="tile"><rect x="3" y="3" width="58" height="58" rx="15"/></clipPath>
    <linearGradient id="base" x1="5" y1="5" x2="59" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93C5FD"/><stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="blue" x1="18" y1="3" x2="57" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/><stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="violet" x1="3" y1="12" x2="31" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0ABFC"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="cyan" x1="4" y1="58" x2="40" y2="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/><stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="magenta" x1="34" y1="61" x2="61" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C084FC"/><stop offset="1" stop-color="#F9A8D4"/>
    </linearGradient>
    <linearGradient id="glass" x1="9" y1="18" x2="55" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173B72" stop-opacity=".88"/><stop offset=".52" stop-color="#263469" stop-opacity=".84"/><stop offset="1" stop-color="#472967" stop-opacity=".8"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="3" y="3" width="58" height="58" fill="url(#base)"/>
    <path d="M3 3h37L25 26H3Z" fill="url(#violet)"/>
    <path d="M28 3h33v31L45 27Z" fill="url(#blue)"/>
    <path d="M3 25 20 14l22 47H3Z" fill="url(#cyan)"/>
    <path d="m36 61 25-34v34Z" fill="url(#magenta)"/>
  </g>
  <circle cx="32" cy="32" r="23.5" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".12" stroke-width=".75"/>
  <path d="M21 19h-2a4 4 0 0 0-4 4v18a4 4 0 0 0 4 4h2" stroke="#CFE3FF" stroke-width="4.25" stroke-linecap="round"/>
  <path d="M43 19h2a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4h-2" stroke="#E8DDFF" stroke-width="4.25" stroke-linecap="round"/>
  <g stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="22.5" y="24" width="19" height="16" rx="3"/>
    <path d="m23.5 36.5 5.8-5.4a1.4 1.4 0 0 1 1.9 0l4.2 4 2.1-1.8a1.4 1.4 0 0 1 1.8 0l1.4 1.3"/>
  </g>
  <circle cx="35.8" cy="29.4" r="1.55" fill="#FFFFFF"/>
</svg>
